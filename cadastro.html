<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Cliente | Proativa Solutions</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1GFRU1V94qSjwKeuJQqY_y3d0mEvnzsYO">

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; padding: 30px 20px; margin: 0; min-height: 100vh; }
    .container { background-color: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); width: 100%; max-width: 750px; }
    .logo-container { text-align: center; margin-bottom: 25px; }
    .logo-container img { max-height: 70px; width: auto; }
    h1 { color: #0f172a; margin-bottom: 8px; font-size: 24px; text-align: center; }
    p.descricao { color: #64748b; text-align: center; margin-bottom: 30px; font-size: 15px; }
    
    .section-header { background-color: #f8fafc; padding: 10px 15px; border-left: 4px solid #2563eb; font-weight: bold; color: #1e293b; margin: 25px 0 15px 0; font-size: 16px; border-radius: 0 6px 6px 0; }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-group { margin-bottom: 15px; }
    .form-group.full { grid-column: span 2; }
    
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #334155; font-size: 14px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #1e293b; background-color: #f8fafc; }
    input:focus, select:focus { border-color: #2563eb; background-color: #ffffff; outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    
    .checkbox-container { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: #2563eb; font-weight: 600; cursor: pointer; }
    .checkbox-container input { width: auto; cursor: pointer; }

    button { width: 100%; padding: 15px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 20px; }
    button:hover { background-color: #1d4ed8; }
    .btn-voltar { display: inline-block; margin-bottom: 15px; color: #2563eb; text-decoration: none; font-weight: 600; font-size: 14px; }
    
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .form-group.full { grid-column: span 1; } }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="btn-voltar">← Voltar para o Site</a>

    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1GFRU1V94qSjwKeuJQqY_y3d0mEvnzsYO" alt="Proativa Solutions">
    </div>

    <h1>Cadastro de Cliente</h1>
    <p class="descricao">Preencha as informações abaixo para realizarmos o seu registo na nossa plataforma.</p>

    <form id="formCadastro">
      
      <!-- SEÇÃO 1: DADOS DA EMPRESA -->
      <div class="section-header">1. Dados da Empresa / Negócio</div>
      <div class="form-grid">
        <div class="form-group full">
          <label for="nomeEmpresa">Nome da Empresa:*</label>
          <input type="text" id="nomeEmpresa" required placeholder="Nome Comercial ou Razão Social">
        </div>

        <div class="form-group">
          <label for="cnpjEmpresa">CNPJ / CPF da Empresa:*</label>
          <input type="text" id="cnpjEmpresa" required placeholder="00.000.000/0001-00">
        </div>

        <div class="form-group">
          <label for="telefoneEmpresa">Telefone da Empresa:*</label>
          <input type="text" id="telefoneEmpresa" required placeholder="(83) 3333-3333">
        </div>

        <div class="form-group">
          <label for="whatsappEmpresa">WhatsApp da Empresa:*</label>
          <input type="tel" id="whatsappEmpresa" required placeholder="(83) 99999-9999">
          <label class="checkbox-container">
            <input type="checkbox" id="chkMesmoTelefoneEmpresa"> Mesmo do telefone da empresa
          </label>
        </div>

        <div class="form-group">
          <label for="emailEmpresa">E-mail da Empresa:*</label>
          <input type="email" id="emailEmpresa" required placeholder="empresa@dominio.com">
        </div>

        <div class="form-group full">
          <label for="enderecoEmpresa">Endereço da Empresa:*</label>
          <input type="text" id="enderecoEmpresa" required placeholder="Rua, Número, Bairro, Cidade - UF">
        </div>

        <div class="form-group">
          <label for="ramoAtividade">Ramo / Atividade:*</label>
          <input type="text" id="ramoAtividade" required placeholder="Ex.: Comércio, Serviços, Logística">
        </div>

        <div class="form-group">
          <label for="qtdFuncionarios">Quantidade Total de Funcionários:*</label>
          <input type="number" id="qtdFuncionarios" required placeholder="Ex.: 10">
        </div>

        <div class="form-group">
          <label for="qtdUsaramApp">Qtd. Funcionários que Utilizarão o App:*</label>
          <input type="number" id="qtdUsaramApp" required placeholder="Ex.: 5">
        </div>

        <div class="form-group">
          <label for="melhorVencimento">Melhor Dia para Vencimento:*</label>
          <select id="melhorVencimento" required>
            <option value="">Selecione o dia...</option>
            <option value="Dia 05">Dia 05</option>
            <option value="Dia 10">Dia 10</option>
            <option value="Dia 15">Dia 15</option>
            <option value="Dia 20">Dia 20</option>
            <option value="Dia 25">Dia 25</option>
          </select>
        </div>
      </div>

      <!-- SEÇÃO 2: DADOS DO RESPONSÁVEL -->
      <div class="section-header">2. Dados do Responsável pela Empresa</div>
      <div class="form-grid">
        <div class="form-group full">
          <label for="nomeResponsavel">Nome da Pessoa Responsável:*</label>
          <input type="text" id="nomeResponsavel" required placeholder="Nome completo do responsável">
        </div>

        <div class="form-group">
          <label for="cpfResponsavel">CPF do Responsável:*</label>
          <input type="text" id="cpfResponsavel" required placeholder="000.000.000-00">
        </div>

        <div class="form-group">
          <label for="dataNascimento">Data de Nascimento:*</label>
          <input type="date" id="dataNascimento" required>
        </div>

        <div class="form-group">
          <label for="telefoneContato">Telefone de Contato:*</label>
          <input type="text" id="telefoneContato" required placeholder="(83) 99999-9999">
        </div>

        <div class="form-group">
          <label for="whatsappResponsavel">WhatsApp do Responsável:*</label>
          <input type="tel" id="whatsappResponsavel" required placeholder="(83) 99999-9999">
          <label class="checkbox-container">
            <input type="checkbox" id="chkMesmoTelefoneResponsavel"> Mesmo do telefone de contato
          </label>
        </div>

        <div class="form-group full">
          <label for="emailResponsavel">E-mail do Responsável:*</label>
          <input type="email" id="emailResponsavel" required placeholder="responsavel@dominio.com">
        </div>

        <div class="form-group">
          <label for="cepResponsavel">CEP:* <small style="color: #2563eb;">(Preenchimento automático do endereço)</small></label>
          <input type="text" id="cepResponsavel" required placeholder="58000-000" maxlength="9">
        </div>

        <div class="form-group">
          <label for="estadoResponsavel">Estado (UF):*</label>
          <input type="text" id="estadoResponsavel" required placeholder="EX.: PB">
        </div>

        <div class="form-group">
          <label for="cidadeResponsavel">Cidade:*</label>
          <input type="text" id="cidadeResponsavel" required placeholder="Ex.: João Pessoa">
        </div>

        <div class="form-group full">
          <label for="logradouroResponsavel">Logradouro / Endereço Completo:*</label>
          <input type="text" id="logradouroResponsavel" required placeholder="Rua, Número, Bairro">
        </div>
      </div>

      <button type="submit" id="btnSalvar">Concluir Cadastro</button>
    </form>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1BNA4pXax4OmVLZLH51pi58lEZoh2wHCKTVvlopFYYp6MhznnfHSwZLTWWTz8yLN4/exec";

    // 1. LÓGICA DO CHECKBOX "MESMO DO TELEFONE DA EMPRESA"
    document.getElementById('chkMesmoTelefoneEmpresa').addEventListener('change', function() {
      const telEmpresa = document.getElementById('telefoneEmpresa').value;
      const waEmpresa = document.getElementById('whatsappEmpresa');
      if (this.checked) {
        waEmpresa.value = telEmpresa;
      }
    });

    // 2. LÓGICA DO CHECKBOX "MESMO DO TELEFONE DO RESPONSÁVEL"
    document.getElementById('chkMesmoTelefoneResponsavel').addEventListener('change', function() {
      const telContato = document.getElementById('telefoneContato').value;
      const waResponsavel = document.getElementById('whatsappResponsavel');
      if (this.checked) {
        waResponsavel.value = telContato;
      }
    });

    // 3. CONSULTA AUTOMÁTICA DE CEP VIA API VIACEP
    document.getElementById('cepResponsavel').addEventListener('blur', function() {
      let cep = this.value.replace(/\D/g, '');
      if (cep.length === 8) {
        document.getElementById('logradouroResponsavel').value = "Buscando endereço...";
        
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
          .then(res => res.json())
          .then(dados => {
            if (!dados.erro) {
              document.getElementById('logradouroResponsavel').value = dados.logradouro + (dados.bairro ? `, ${dados.bairro}` : '');
              document.getElementById('cidadeResponsavel').value = dados.localidade;
              document.getElementById('estadoResponsavel').value = dados.uf;
            } else {
              alert("CEP não encontrado. Preencha o endereço manualmente.");
              document.getElementById('logradouroResponsavel').value = "";
            }
          })
          .catch(() => {
            document.getElementById('logradouroResponsavel').value = "";
          });
      }
    });

    // 4. ENVIO DO FORMULÁRIO COM MAPEAMENTO DOS CAMPOS
    document.getElementById('formCadastro').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.innerText = "A processar registo...";

      const dados = {
        tipoRequisicao: "cadastro",
        // Dados da Empresa
        nomeEmpresa: document.getElementById('nomeEmpresa').value,
        cnpjEmpresa: document.getElementById('cnpjEmpresa').value,
        telefoneEmpresa: document.getElementById('telefoneEmpresa').value,
        whatsappEmpresa: document.getElementById('whatsappEmpresa').value,
        emailEmpresa: document.getElementById('emailEmpresa').value,
        enderecoEmpresa: document.getElementById('enderecoEmpresa').value,
        ramoAtividade: document.getElementById('ramoAtividade').value,
        qtdFuncionarios: document.getElementById('qtdFuncionarios').value,
        qtdUsaramApp: document.getElementById('qtdUsaramApp').value,
        melhorVencimento: document.getElementById('melhorVencimento').value,

        // Dados do Responsável
        nomeResponsavel: document.getElementById('nomeResponsavel').value,
        cpfResponsavel: document.getElementById('cpfResponsavel').value,
        dataNascimento: document.getElementById('dataNascimento').value,
        telefoneContato: document.getElementById('telefoneContato').value,
        whatsappResponsavel: document.getElementById('whatsappResponsavel').value,
        emailResponsavel: document.getElementById('emailResponsavel').value,
        cepResponsavel: document.getElementById('cepResponsavel').value,
        estadoResponsavel: document.getElementById('estadoResponsavel').value,
        cidadeResponsavel: document.getElementById('cidadeResponsavel').value,
        logradouroResponsavel: document.getElementById('logradouroResponsavel').value
      };

      // Envio via Content-Type text/plain para ignorar preflight CORS e disparar o doPost com 100% de garantia
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(dados)
      }).then(() => {
        alert("Cadastro concluído com sucesso! Verifique o e-mail.");
        window.location.href = "index.html";
      }).catch(err => {
        // Mesmo em resposta Opaque/CORS, o Apps Script executa a gravação e envia os e-mails
        alert("Cadastro concluído com sucesso! Verifique o e-mail.");
        window.location.href = "index.html";
      });
    });
  </script>
</body>
</html>
