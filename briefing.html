<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitação de Projeto | Proativa Solutions</title>
  
  <!-- FAVICON (Ícone da Aba do Navegador) -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1GFRU1V94qSjwKeuJQqY_y3d0mEvnzsYO">

  <!-- ==========================================
       ESTILOS VISUAIS (CSS)
       ========================================== -->
  <style>
    html {
      scroll-behavior: smooth;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }

    .container {
      background-color: #ffffff;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 580px;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-container img {
      max-height: 70px;
      width: auto;
    }

    h1 {
      color: #0f172a;
      margin-bottom: 8px;
      font-size: 22px;
      text-align: center;
    }

    p.descricao {
      color: #64748b;
      text-align: center;
      margin-bottom: 25px;
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #334155;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #1e293b;
      background-color: #f8fafc;
      transition: all 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #2563eb;
      background-color: #ffffff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #25d366;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #1ebc57;
    }

    /* Estilo de Voltar */
    .btn-voltar {
      display: inline-block;
      margin-bottom: 15px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-voltar:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="btn-voltar">← Voltar para o Site</a>

    <!-- Logótipo Proativa Solutions -->
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1GFRU1V94qSjwKeuJQqY_y3d0mEvnzsYO" alt="Proativa Solutions">
    </div>

    <h1>Solicitação de Projeto</h1>
    <p class="descricao">Preencha os detalhes abaixo para analisarmos a melhor solução para o seu negócio.</p>

    <form id="formBriefing">
      <div class="form-group">
        <label for="nome">Seu Nome:</label>
        <input type="text" id="nome" required placeholder="Ex.: João Silva">
      </div>

      <div class="form-group">
        <label for="email">Seu E-mail (para receber a cópia da solicitação):</label>
        <input type="email" id="email" required placeholder="Ex.: joao@empresa.com">
      </div>

      <div class="form-group">
        <label for="whatsapp">WhatsApp para contato:</label>
        <input type="tel" id="whatsapp" required placeholder="(83) 99999-9999" maxlength="15">
      </div>

      <div class="form-group">
        <label for="tipoProjeto">Tipo de Solução Pretendida:</label>
        <select id="tipoProjeto" required>
          <option value="">Selecione uma opção...</option>
          <option value="Aplicativo Personalizado">Aplicativo Personalizado</option>
          <option value="Dashboard Inteligente">Dashboard Inteligente</option>
          <option value="Automação de Processos">Automação de Processos / Tarefas</option>
          <option value="Ainda não tenho certeza">Ainda não tenho certeza (Preciso de consultoria)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="problema">O que espera que a solução resolva?</label>
        <textarea id="problema" rows="4" required placeholder="Descreva a sua necessidade ou o problema atual..."></textarea>
      </div>

      <div class="form-group">
        <label for="prazo">Prazo Estimado:</label>
        <input type="text" id="prazo" placeholder="Ex.: 2 semanas, 1 mês, Urgente">
      </div>

      <div class="form-group">
        <label for="orcamento">Orçamento Disponível (opcional):</label>
        <input type="text" id="orcamento" placeholder="Ex.: R$ 1.500">
      </div>

      <button type="submit">Enviar Solicitação via WhatsApp</button>
    </form>
  </div>

  <!-- ==========================================
       LÓGICA E INTEGRAÇÃO (JAVASCRIPT)
       ========================================== -->
  <script>
    // PARAMETROS DE CONFIGURAÇÃO
    const MEU_NUMERO_WHATSAPP = "5583921468797"; 
    const APPS_SCRIPT_URL = "COLE_AQUI_O_URL_DO_GOOGLE_APPS_SCRIPT"; 

    const inputWhatsapp = document.getElementById('whatsapp');

    // MÁSCARA AUTOMÁTICA EM TEMPO REAL PARA O WHATSAPP
    inputWhatsapp.addEventListener('input', function(e) {
      let valor = e.target.value.replace(/\D/g, ''); // Remove tudo que não for dígito
      
      if (valor.length > 11) valor = valor.slice(0, 11); // Limita a 11 dígitos

      // Aplica a formatação (XX) XXXXX-XXXX
      if (valor.length > 6) {
        valor = `(${valor.slice(0, 2)}) ${valor.slice(2, 7)}-${valor.slice(7)}`;
      } else if (valor.length > 2) {
        valor = `(${valor.slice(0, 2)}) ${valor.slice(2)}`;
      } else if (valor.length > 0) {
        valor = `(${valor}`;
      }

      e.target.value = valor;
    });

    // VALIDAÇÃO E ENVIO DO FORMULÁRIO
    document.getElementById('formBriefing').addEventListener('submit', function(evento) {
      evento.preventDefault(); 

      const email = document.getElementById('email').value.trim();
      const rawWhatsapp = inputWhatsapp.value.replace(/\D/g, ''); // Apenas números

      // Validação de formato de E-mail
      const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!regexEmail.test(email)) {
        alert('Por favor, informe um endereço de e-mail válido.');
        return;
      }

      // Validação de tamanho do número do WhatsApp (Mínimo de 10 ou 11 dígitos com DDD)
      if (rawWhatsapp.length < 10) {
        alert('Por favor, informe um número de WhatsApp válido com DDD (Ex.: 83999999999).');
        return;
      }

      const dados = {
        nome: document.getElementById('nome').value,
        email: email,
        whatsapp: inputWhatsapp.value,
        tipoProjeto: document.getElementById('tipoProjeto').value,
        problema: document.getElementById('problema').value,
        prazo: document.getElementById('prazo').value,
        orcamento: document.getElementById('orcamento').value
      };

      // 1. Envio para o Google Apps Script (e-mail + cópia)
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });

      // 2. Monta mensagem e abre o WhatsApp
      const textoWhatsApp = `*Novo Pedido de Projeto!*%0A%0A` +
        `*Nome:* ${dados.nome}%0A` +
        `*E-mail:* ${dados.email}%0A` +
        `*WhatsApp:* ${dados.whatsapp}%0A` +
        `*Tipo:* ${dados.tipoProjeto}%0A` +
        `*Problema:* ${dados.problema}%0A` +
        `*Prazo:* ${dados.prazo}%0A` +
        `*Orçamento:* ${dados.orcamento}`;

      const urlWhatsApp = `https://wa.me/${MEU_NUMERO_WHATSAPP}?text=${textoWhatsApp}`;
      window.location.href = urlWhatsApp;
    });
  </script>

</body>
</html>
