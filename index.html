<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitação de Projeto | Proativa Solutions</title>
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }

    .container {
      background-color: #ffffff;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 580px;
    }

    /* Estilo do Logótipo no topo */
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-container img {
      max-width: 220px;
      height: auto;
    }

    h1 {
      color: #0f172a;
      margin-bottom: 8px;
      font-size: 22px;
      text-align: center;
    }

    p.descricao {
      color: #64748b;
      text-align: center;
      margin-bottom: 25px;
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #334155;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #1e293b;
      background-color: #f8fafc;
      transition: all 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #2563eb;
      background-color: #ffffff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #25d366;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #1ebc57;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logótipo da Empresa -->
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1dOP4me2iiAevZzWTrzcWtHhpkO2OaJdF" alt="Proativa Solutions">
    </div>

    <h1>Solicitação de Projeto</h1>
    <p class="descricao">Preencha os detalhes abaixo para analisarmos a melhor solução para o seu negócio.</p>

    <form id="formBriefing">
      <div class="form-group">
        <label for="nome">Seu Nome:</label>
        <input type="text" id="nome" required placeholder="Ex.: João Silva">
      </div>

      <div class="form-group">
        <label for="email">Seu E-mail (para receber a cópia da solicitação):</label>
        <input type="email" id="email" required placeholder="Ex.: joao@empresa.com">
      </div>

      <div class="form-group">
        <label for="whatsapp">WhatsApp para contato (com DDD/Código do país):</label>
        <input type="tel" id="whatsapp" required placeholder="Ex.: 5511999999999 ou 351912345678">
      </div>

      <div class="form-group">
        <label for="tipoProjeto">Tipo de Projeto Pretendido:</label>
        <select id="tipoProjeto" required>
          <option value="">Selecione uma opção...</option>
          <option value="App">App</option>
          <option value="Ainda não tenho certeza">Ainda não tenho certeza (Preciso de consultoria)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="problema">O que espera que o app resolva?</label>
        <textarea id="problema" rows="4" required placeholder="Descreva a sua necessidade ou o problema atual..."></textarea>
      </div>

      <div class="form-group">
        <label for="prazo">Prazo Estimado:</label>
        <input type="text" id="prazo" placeholder="Ex.: 2 semanas, 1 mês, Urgente">
      </div>

      <div class="form-group">
        <label for="orcamento">Orçamento Disponível Mensal (opcional):</label>
        <input type="text" id="orcamento" placeholder="Ex.: R$ 1.500 ou € 300">
      </div>

      <button type="submit">Enviar Solicitação via WhatsApp</button>
    </form>
  </div>

  <script>
    // PARÂMETROS DE CONFIGURAÇÃO
    const MEU_NUMERO_WHATSAPP = "5583987778549"; // O teu WhatsApp com DDD/Código do país
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPVY-as5xeAQoPGD7PL6VTR39S4ohk_CjF5-Ano0vRBbosD7o8DZDFxc_DBwKpbRCU/exec"; // URL da implantação do Apps Script

    document.getElementById('formBriefing').addEventListener('submit', function(evento) {
      evento.preventDefault(); 

      const dados = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        whatsapp: document.getElementById('whatsapp').value,
        tipoProjeto: document.getElementById('tipoProjeto').value,
        problema: document.getElementById('problema').value,
        prazo: document.getElementById('prazo').value,
        orcamento: document.getElementById('orcamento').value
      };

      // 1. Envia os dados para o Google Apps Script
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });

      // 2. Prepara e redireciona para o WhatsApp
      const textoWhatsApp = `*Novo Pedido de Projeto!*%0A%0A` +
        `*Nome:* ${dados.nome}%0A` +
        `*E-mail:* ${dados.email}%0A` +
        `*WhatsApp:* ${dados.whatsapp}%0A` +
        `*Tipo:* ${dados.tipoProjeto}%0A` +
        `*Problema:* ${dados.problema}%0A` +
        `*Prazo:* ${dados.prazo}%0A` +
        `*Orçamento:* ${dados.orcamento}`;

      const urlWhatsApp = `https://wa.me/${MEU_NUMERO_WHATSAPP}?text=${textoWhatsApp}`;
      window.location.href = urlWhatsApp;
    });
  </script>

</body>
</html>
